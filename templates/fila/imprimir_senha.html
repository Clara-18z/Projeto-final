<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senha {{ senha.codigo_exibicao }} | Clínica Nexo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 24rem; text-align: center; }
      .ticket { border: 1px solid #222; padding: 1.5rem; }
      .code { font-size: 2.5rem; font-weight: bold; margin: 1rem 0; }
      .room-label { font-size: 1.2rem; font-weight: bold; }
      @media print { .print-button { display: none; } body { margin: 0; } }
    </style>
  </head>
  <body>
    <main class="ticket">
      <h1>Clínica Nexo</h1>
      <p>Senha de atendimento</p>
      <p class="code">{{ senha.codigo_exibicao }}</p>
      <p><span class="room-label">Sala:</span> {{ senha.sala.nome if senha.sala else 'A definir' }}</p>
      <p class="ticket-instruction">Aguarde a chamada da sua senha no painel. Dirija-se à sala somente depois de ser chamado.</p>
      <button class="print-button" type="button" onclick="window.print()">Imprimir</button>
    </main>
  </body>
</html>
